plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.horizon.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'app.horizon.launcher'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '2.1-phase1'
    }

    // Fixed key so every build installs over the previous one (keeps your layout).
    signingConfigs {
        horizon {
            storeFile file('horizon.keystore')
            storePassword 'horizon-tv'
            keyAlias 'horizon'
            keyPassword 'horizon-tv'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.horizon
        }
        debug {
            signingConfig signingConfigs.horizon
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.tv:tv-material:1.0.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}
