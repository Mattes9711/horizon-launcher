name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface compiler / lint errors as annotations (readable via the API)
            grep -E "^e: |error:|Error:|What went wrong" -A3 build.log | grep -v '^--$' | head -40 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: app/build/outputs/apk/release/*.apk
